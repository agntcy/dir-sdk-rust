[package]
name = "agntcy-dir"
version = "1.8.1"
edition = "2021"
rust-version = "1.86"
description = "Rust SDK for the AGNTCY Directory"
license = "Apache-2.0"
homepage = "https://github.com/agntcy/dir-sdk-rust"
repository = "https://github.com/agntcy/dir-sdk-rust"
keywords = ["sdk", "client", "directory", "agntcy", "grpc"]
# `proto/` is git-ignored (exported from the BSR by `task proto:export`) but
# must ship in the crate so `build.rs` can generate the stubs on docs.rs / users' machines.
include = ["/src", "/proto", "/build.rs", "/examples", "/tests", "/README.md", "/LICENSE", "/Cargo.toml"]

[dependencies]
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "io-util", "sync"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
url = "2"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "7"
open = "5"
regex = "1"
# Native signing / verification: cosign-compatible key handling (RustCrypto) ...
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "digest"] }
sha2_010 = { package = "sha2", version = "0.10" }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
scrypt = { version = "0.11", default-features = false, features = ["std"] }
crypto_secretbox = { version = "0.1", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# ... and keyless Sigstore (Fulcio + Rekor + TSA signing, bundle verification).
x509-cert = "0.2"
sigstore-bundle = { version = "0.15", default-features = false }
sigstore-crypto = { version = "0.15", default-features = false, features = ["aws-lc-rs"] }
sigstore-fulcio = { version = "0.15", default-features = false, features = ["rustls"] }
sigstore-oidc = { version = "0.15", default-features = false }
sigstore-rekor = { version = "0.15", default-features = false, features = ["client", "rustls"] }
sigstore-trust-root = { version = "0.15", default-features = false, features = ["tuf", "rustls", "aws-lc-rs"] }
sigstore-tsa = { version = "0.15", default-features = false, features = ["client", "rustls"] }
sigstore-types = "0.15"
sigstore-verify = { version = "0.15", default-features = false, features = ["rustls", "aws-lc-rs"] }

[build-dependencies]
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
protox = "0.10"
pbjson-build = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
